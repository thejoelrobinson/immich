#
# WARNING: To install Immich, follow our guide: https://docs.immich.app/install/docker-compose
#
# Make sure to use the docker-compose.yml of the current release:
#
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# The compose file on main may not be compatible with the latest release.

name: immich-prod

services:
  immich-server:
    container_name: immich_server
    image: immich-server:latest
    # Install poppler-utils for PDF thumbnail rendering, libreoffice for Office docs, MS-compatible fonts for better rendering
    command: ["apt-get update -qq && apt-get install -y -qq poppler-utils libreoffice-writer libreoffice-calc libreoffice-impress fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation --no-install-recommends && exec start.sh"]
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    build:
      context: ../
      dockerfile: server/Dockerfile
    volumes:
      - ${UPLOAD_LOCATION}/photos:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - 2283:2283
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: immich-machine-learning:latest
    # extends:
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference
    build:
      context: ../machine-learning
      dockerfile: Dockerfile
      args:
        - DEVICE=cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference
    ports:
      - 3003:3003
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:8@sha256:81db6d39e1bba3b3ff32bd3a1b19a6d69690f94a3954ec131277b9a26b95b3aa
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      # Use Docker named volume for macOS compatibility (avoid permission issues)
      - postgres-prod-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    shm_size: 128mb
    restart: always

  # set IMMICH_TELEMETRY_INCLUDE=all in .env to enable metrics
  immich-prometheus:
    container_name: immich_prometheus
    ports:
      - 9090:9090
    image: prom/prometheus@sha256:49214755b6153f90a597adcbff0252cc61069f8ab69ce8411285cd4a560e8038
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

  # first login uses admin/admin
  # add data source for http://immich-prometheus:9090 to get started
  immich-grafana:
    container_name: immich_grafana
    command: ['./run.sh', '-disable-reporting']
    ports:
      - 3000:3000
    image: grafana/grafana:12.2.1-ubuntu@sha256:797530c642f7b41ba7848c44cfda5e361ef1f3391a98bed1e5d448c472b6826a
    volumes:
      - grafana-data:/var/lib/grafana

  # ONLYOFFICE Document Server for Office document viewing
  onlyoffice:
    container_name: immich_onlyoffice
    # Unlimited connections community build (official has 20-connection limit)
    image: thomisus/onlyoffice-documentserver-unlimited:latest
    environment:
      # JWT authentication for secure document access
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-immich-onlyoffice-dev-secret}
      JWT_HEADER: Authorization
      # Disable WOPI - we use direct URL access
      WOPI_ENABLED: "false"
      # Allow internal network access for document downloads
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "true"
    ports:
      - 8080:80
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-logs:/var/log/onlyoffice
      # Init script to increase file size limits (100MB -> 500MB) and register custom fonts
      - ./onlyoffice-init.sh:/onlyoffice-init.sh:ro
      # Custom corporate fonts (Bogle, EverydaySans)
      - ../Fonts:/custom-fonts:ro
    # Override entrypoint to run our init script before ONLYOFFICE starts
    entrypoint: ["/bin/bash", "-c"]
    command: ["/onlyoffice-init.sh & exec /app/ds/run-document-server.sh"]
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Video Transcription Service (faster-whisper + speechbrain for speaker diarization)
  immich-transcription:
    container_name: immich_transcription
    build:
      context: ../transcription
      dockerfile: Dockerfile
      args:
        - DEVICE=cpu  # set to 'cuda' for GPU acceleration
    ports:
      - 3004:3004
    volumes:
      - ${UPLOAD_LOCATION}/photos:/data:ro
      - transcription-model-cache:/cache
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      DEVICE: ${TRANSCRIPTION_DEVICE:-cpu}
      DIARIZATION_ENABLED: ${TRANSCRIPTION_DIARIZATION:-true}
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3004/ping')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  model-cache:
  transcription-model-cache:
  onlyoffice-data:
  onlyoffice-logs:
  prometheus-data:
  grafana-data:
  postgres-prod-data:
